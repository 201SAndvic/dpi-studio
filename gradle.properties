org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# 版本规则
#   大改（加功能、改结构）：第二位 +1 并开一个新的小改序列
#        0.1 →（大改）0.2 →（小改）0.21 → 0.22 → …
#   小改（修问题、微调）：小改序列里递增
#        0.1 → 0.11 → 0.12 → 0.13 → …
#   永远不要到 1.0。versionCode 每次发布 +1。
#   改版本请只改 app/build.gradle.kts 里的 versionName / versionCode。
# ---------------------------------------------------------------------------
